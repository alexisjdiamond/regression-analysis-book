name: Build book PDF

# Recompiles the book on every push that touches the LaTeX source, so the
# published PDF can never drift from the source. On a version tag (v0.9,
# v1.0, ...) it also attaches the PDF to a GitHub Release, giving the
# public a stable versioned download URL.

on:
  push:
    branches: [main]
    paths:
      - "regression_analysis_complete_final.tex"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # latexmk runs the correct pdflatex/makeindex cycle automatically,
      # repeating passes until the TOC and index page numbers stabilize.
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: regression_analysis_complete_final.tex
          latexmk_use_lualatex: false

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: regression_analysis_complete_final
          path: regression_analysis_complete_final.pdf

      - name: Refresh the copy served by GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          cp regression_analysis_complete_final.pdf docs/regression_analysis_complete_final.pdf
          if ! git diff --quiet docs/regression_analysis_complete_final.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/regression_analysis_complete_final.pdf
            git commit -m "CI: rebuild PDF from source"
            # Rebase first: pushes made while this build was running would
            # otherwise reject this one as a non-fast-forward.
            git pull --rebase origin main
            git push
          fi

      - name: Attach PDF to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: regression_analysis_complete_final.pdf
